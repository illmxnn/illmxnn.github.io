  <line x1="15" y1="32" x2="49" y2="32" stroke="url(#g)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="15" cy="32" r="6" fill="#0A0A12" stroke="#7C5CFF" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="7" fill="#38E1FF" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.6" fill="#0A0A12" opacity="0.85"/>
  <circle cx="49" cy="32" r="6" fill="#0A0A12" stroke="#FF4ECD" stroke-width="3.5"/>
